name: Mantener Supabase activo

# Supabase pausa los proyectos del plan gratis tras 7 dias sin actividad.
# Este workflow hace una consulta liviana cada 3 dias para evitarlo.

on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar una sucursal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL y SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/brasa_branches?select=id&limit=1"
